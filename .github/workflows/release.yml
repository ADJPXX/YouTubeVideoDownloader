name: Build Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar pacotes
        run: dotnet restore

      - name: Publicar projeto
        run: |
          dotnet publish ./YouTubeVideoDownloader/YouTubeVideoDownloader.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:EnableCompressionInSingleFile=false `
            /p:PublishTrimmed=false `
            -o publish

      - name: Baixar FFmpeg
        run: |
          Invoke-WebRequest `
            -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile "ffmpeg.zip"

      - name: Extrair FFmpeg
        run: |
          Expand-Archive ffmpeg.zip ffmpeg

      - name: Copiar apenas ffmpeg.exe
        shell: pwsh
        run: |
          $ffmpeg = Get-ChildItem -Recurse -Filter ffmpeg.exe ffmpeg | Select-Object -First 1

          New-Item -ItemType Directory -Force -Path publish\ffmpeg | Out-Null

          Copy-Item $ffmpeg.FullName publish\ffmpeg\ffmpeg.exe

      - name: Compactar publicação
        run: |
          Compress-Archive -Path publish\* -DestinationPath YouTubeVideoDownloader.zip

      - name: Criar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            YouTubeVideoDownloader.zip